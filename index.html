<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Prizma — a neon sci-fi action mystery across four mirrored realities."
    />
    <title>Prizma</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="hud-left">
          <div class="hud-title">
            <span class="zone"></span>
            <span class="room-name"></span>
          </div>
          <div class="hud-life">
            <span class="hp"></span>
            <span class="inv"></span>
          </div>
        </div>
        <div class="hud-stats">
          <span class="logs"></span>
          <span class="echoes"></span>
        </div>
        <div class="hud-buttons">
          <button class="map-btn" aria-label="Map">▦</button>
          <button class="mute" aria-label="Sound">♪</button>
          <button class="pause" aria-label="Pause">❚❚</button>
        </div>
      </div>
      <div class="boss" hidden>
        <div class="boss-name"></div>
        <div class="boss-bar"><i></i></div>
      </div>
      <div class="realities"></div>
      <div class="touch-buttons">
        <button class="t-fire" aria-label="Fire">✦</button>
        <button class="t-dash" aria-label="Dash">»</button>
        <button class="t-lens" aria-label="Prism lens" hidden>◇</button>
        <button class="t-peek" aria-label="Look through">◎</button>
      </div>
    </div>

    <div id="toast"></div>
    <div id="zone-card">
      <div class="zc-zone"></div>
      <div class="zc-no"></div>
    </div>

    <div id="dialog" hidden>
      <div class="who"></div>
      <div class="text"></div>
      <div class="more">▸</div>
    </div>

    <section id="title" class="screen">
      <canvas class="title-art"></canvas>
      <div class="title-inner">
        <h1 class="logo" data-text="PRIZMA">PRIZMA</h1>
        <div class="spectrum"><i></i><i></i><i></i><i></i></div>
        <p class="tagline"></p>
        <div class="menu">
          <button class="continue big" hidden></button>
          <button class="new big"></button>
        </div>
        <div class="langs">
          <button data-lang="en">EN</button>
          <button data-lang="sk">SK</button>
          <button data-lang="cs">CZ</button>
        </div>
        <p class="controls"></p>
      </div>
    </section>

    <section id="confirm" class="screen dim" hidden>
      <p class="confirm-text"></p>
      <div class="row">
        <button class="yes big"></button>
        <button class="no big"></button>
      </div>
    </section>

    <section id="paused" class="screen dim" hidden>
      <h2 class="paused-title"></h2>
      <button class="resume big"></button>
      <button class="restart"></button>
      <button class="sound"></button>
      <button class="to-menu"></button>
      <p class="paused-controls"></p>
    </section>

    <section id="map" class="screen dim" hidden>
      <h2 class="map-title"></h2>
      <div class="map-grid"></div>
      <p class="map-hint"></p>
      <button class="map-close"></button>
    </section>

    <section id="dead" class="screen" hidden>
      <h2 class="dead-title"></h2>
      <p class="dead-text"></p>
    </section>

    <section id="choice" class="screen dim" hidden>
      <h2 class="choice-title"></h2>
      <div class="choices"></div>
    </section>

    <section id="ending" class="screen" hidden>
      <h2 class="ending-title"></h2>
      <p class="ending-text"></p>
      <p class="ending-stats"></p>
      <p class="ending-credits"></p>
      <button class="ending-menu big"></button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
