<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Prizma — a neon sci-fi puzzle mystery across four mirrored realities."
    />
    <title>Prizma</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="hud-title">
          <span class="zone"></span>
          <span class="chamber-no"></span>
        </div>
        <div class="hud-stats">
          <span class="moves"></span>
          <span class="logs"></span>
          <span class="echoes"></span>
          <span class="inv"></span>
        </div>
        <div class="hud-buttons">
          <button class="hint" aria-label="Hint">?</button>
          <button class="undo" aria-label="Undo">↶</button>
          <button class="reset" aria-label="Restart">⟲</button>
          <button class="mute" aria-label="Sound">♪</button>
          <button class="pause" aria-label="Pause">❚❚</button>
        </div>
      </div>
      <div class="realities"></div>
      <button class="peek" aria-label="Look through">◎</button>
      <div class="pad">
        <button data-dir="0" aria-label="Up">▲</button>
        <button data-dir="3" aria-label="Left">◀</button>
        <button data-dir="1" aria-label="Right">▶</button>
        <button data-dir="2" aria-label="Down">▼</button>
      </div>
    </div>

    <div id="toast"></div>
    <div id="zone-card">
      <div class="zc-zone"></div>
      <div class="zc-no"></div>
    </div>

    <div id="dialog" hidden>
      <div class="who"></div>
      <div class="text"></div>
      <div class="more">▸</div>
    </div>

    <section id="title" class="screen">
      <canvas class="title-art"></canvas>
      <div class="title-inner">
        <h1 class="logo" data-text="PRIZMA">PRIZMA</h1>
        <div class="spectrum"><i></i><i></i><i></i><i></i></div>
        <p class="tagline"></p>
        <div class="menu">
          <button class="continue big" hidden></button>
          <button class="new big"></button>
          <button class="chambers-btn"></button>
        </div>
        <div class="langs">
          <button data-lang="en">EN</button>
          <button data-lang="sk">SK</button>
          <button data-lang="cs">CZ</button>
        </div>
        <p class="controls"></p>
      </div>
    </section>

    <section id="chambers" class="screen" hidden>
      <h2 class="chambers-title"></h2>
      <div class="grid"></div>
      <button class="back"></button>
    </section>

    <section id="confirm" class="screen dim" hidden>
      <p class="confirm-text"></p>
      <div class="row">
        <button class="yes big"></button>
        <button class="no big"></button>
      </div>
    </section>

    <section id="paused" class="screen dim" hidden>
      <h2 class="paused-title"></h2>
      <button class="resume big"></button>
      <button class="restart"></button>
      <button class="sound"></button>
      <button class="to-menu"></button>
      <p class="paused-controls"></p>
    </section>

    <section id="cleared" class="screen dim" hidden>
      <h2 class="cleared-title"></h2>
      <p class="cleared-moves"></p>
      <button class="next big"></button>
    </section>

    <section id="choice" class="screen dim" hidden>
      <h2 class="choice-title"></h2>
      <div class="choices"></div>
    </section>

    <section id="ending" class="screen" hidden>
      <h2 class="ending-title"></h2>
      <p class="ending-text"></p>
      <p class="ending-stats"></p>
      <p class="ending-credits"></p>
      <button class="ending-menu big"></button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
