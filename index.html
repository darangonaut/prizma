<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Prizma — one move, four mirrors. A neon action game where you control four mirrored copies of yourself at once."
    />
    <title>Prizma</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <div class="hud-top">
        <div class="hud-title">
          <span class="chap"></span>
          <span class="lvl"></span>
        </div>
        <div class="hud-mid">
          <span class="time"></span>
          <span class="shards"></span>
        </div>
        <div class="hud-buttons">
          <button class="restart-btn" aria-label="Restart">↻</button>
          <button class="mute" aria-label="Sound">♪</button>
          <button class="pause" aria-label="Pause">❚❚</button>
        </div>
      </div>
      <div class="start-hint"></div>
      <button class="t-dash" aria-label="Dash">»</button>
    </div>

    <div id="toast"></div>
    <div id="zone-card">
      <div class="zc-zone"></div>
      <div class="zc-no"></div>
    </div>

    <div id="dialog" hidden>
      <div class="who"></div>
      <div class="text"></div>
      <div class="more">▸</div>
    </div>

    <section id="title" class="screen">
      <canvas class="title-art"></canvas>
      <div class="title-inner">
        <h1 class="logo" data-text="PRIZMA">PRIZMA</h1>
        <div class="spectrum"><i></i><i></i><i></i><i></i></div>
        <p class="tagline"></p>
        <div class="menu">
          <button class="continue big"></button>
          <button class="levels-btn big"></button>
        </div>
        <div class="langs">
          <button data-lang="en">EN</button>
          <button data-lang="sk">SK</button>
          <button data-lang="cs">CZ</button>
        </div>
        <p class="controls"></p>
      </div>
    </section>

    <section id="levels" class="screen dim" hidden>
      <h2 class="levels-title"></h2>
      <div class="chapters"></div>
      <button class="levels-back"></button>
    </section>

    <section id="paused" class="screen dim" hidden>
      <h2 class="paused-title"></h2>
      <button class="resume big"></button>
      <button class="restart"></button>
      <button class="to-levels"></button>
      <button class="sound"></button>
      <button class="to-menu"></button>
      <p class="paused-controls"></p>
    </section>

    <section id="clear" class="screen dim" hidden>
      <h2 class="clear-title"></h2>
      <div class="clear-time"></div>
      <div class="clear-best"></div>
      <div class="clear-star"></div>
      <div class="row">
        <button class="clear-next big"></button>
      </div>
      <div class="row">
        <button class="clear-retry"></button>
        <button class="clear-levels"></button>
      </div>
    </section>

    <section id="ending" class="screen" hidden>
      <h2 class="ending-title"></h2>
      <p class="ending-text"></p>
      <p class="ending-stats"></p>
      <p class="ending-credits"></p>
      <button class="ending-menu big"></button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
